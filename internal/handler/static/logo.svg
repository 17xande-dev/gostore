<?xml version="1.0" encoding="UTF-8"?>
<!--
  The default store mark: an abstract carrier bag, deliberately generic.

  No text, because the store's name comes from STORE_NAME and a logo with a name
  baked into it would be wrong for every adopter but one. No colour beyond
  currentColor, so it takes the surrounding text colour and works on a light or dark
  page without a second file.

  Replace it by putting your own logo.svg in STATIC_DIR — no rebuild needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Store">
  <path d="M4 8h16l-1.2 12H5.2L4 8Z"/>
  <path d="M9 8V5.5a3 3 0 0 1 6 0V8"/>
</svg>
