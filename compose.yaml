# The whole local stack. `make up` should be the entire quickstart.
name: gostore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gostore
      POSTGRES_PASSWORD: gostore
      POSTGRES_DB: gostore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gostore -d gostore"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Catches every outgoing email in development; web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible object storage, so image uploads work locally exactly as they
  # will against S3 or GCS in production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gostore
      MINIO_ROOT_PASSWORD: gostore123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://gostore:gostore@postgres:5432/gostore?sslmode=disable
      BASE_URL: http://localhost:8080
      STORE_NAME: gostore
      CURRENCY: ZAR
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
