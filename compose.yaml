# Local development: Go, Postgres, Mailpit, and ordinary files. Production
# deployments in deploy/ use public-image and private-download R2 buckets.
name: gostore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gostore
      POSTGRES_PASSWORD: gostore
      POSTGRES_DB: gostore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gostore -d gostore"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  server:
    build: .
    # make up supplies the host UID/GID and creates these bind directories, so
    # container uploads and host-side make run/seed share writable files.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://gostore:gostore@postgres:5432/gostore?sslmode=disable
      PORT: "8080"
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      STORE_NAME: ${STORE_NAME:-gostore}
      CURRENCY: ${CURRENCY:-ZAR}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-10000100}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-46f0cd694581a}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-jt7NOE43FZPn}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-true}
      PAYFAST_ALLOWED_CIDRS: ${PAYFAST_ALLOWED_CIDRS:-any}
      PAYFAST_NOTIFY_URL: ${PAYFAST_NOTIFY_URL:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      EMAIL_FROM: ${EMAIL_FROM:-orders@gostore.example}
      ORDER_NOTIFY_EMAIL: ${ORDER_NOTIFY_EMAIL:-shop@gostore.example}
      # Public development key, never use for a live store. Production requires
      # a generated EMAIL_QUEUE_KEY (or EMAIL_QUEUE_KEY_FILE).
      EMAIL_QUEUE_KEY: ${EMAIL_QUEUE_KEY:-abababababababababababababababababababababababababababababababab}
      IMAGE_DIR: /images
      DOWNLOAD_DIR: /downloads
      # An older .env may still contain S3 settings. Development deliberately
      # uses disk; choose deploy/ for an R2-backed installation.
      BLOB_ENDPOINT: ""
      BLOB_BUCKET: ""
      BLOB_ACCESS_KEY_ID: ""
      BLOB_SECRET_ACCESS_KEY: ""
      BLOB_PUBLIC_BASE_URL: ""
      DOWNLOAD_ENDPOINT: ""
      DOWNLOAD_BUCKET: ""
      DOWNLOAD_ACCESS_KEY_ID: ""
      DOWNLOAD_SECRET_ACCESS_KEY: ""
      DOWNLOAD_PUBLIC_ENDPOINT: ""
      TEMPLATE_DIR: /theme/templates
      STATIC_DIR: /theme/static
      THEME_RELOAD: ${THEME_RELOAD:-true}
    volumes:
      - ./.local/images:/images
      - ./.local/downloads:/downloads
      - ./theme:/theme:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
