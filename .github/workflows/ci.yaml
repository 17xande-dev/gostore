name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gostore
          POSTGRES_PASSWORD: gostore
          POSTGRES_DB: gostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gostore -d gostore"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://gostore:gostore@localhost:5432/gostore?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # The generated stores must match the SQL they came from. A query edited
      # without regenerating would otherwise reach main as code that compiles and
      # runs the old statement.
      - run: make sqlc-install
      - run: make sqlc-check

      - run: go vet ./...
      - run: go build ./...
      # The database-backed tests run here, so a PR cannot break migrations
      # silently.
      - run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gostore:ci .
