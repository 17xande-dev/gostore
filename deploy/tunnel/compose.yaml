# gostore behind a Cloudflare Tunnel, with product images in a MinIO beside it
# and mail through Microsoft Graph. Nothing here publishes a port: cloudflared
# dials out, so the server needs no public address, no port forward and no
# certificate.
#
# Copy this directory to the server, then:
#
#   cp .env.example .env && chmod 600 .env    # and fill it in
#   docker compose up -d
#
# Every step, including creating the tunnel, is in docs/deploy/tunnel.md.
name: gostore

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gostore
      POSTGRES_DB: gostore
      # Read once, when the data directory is first created. Changing it in .env
      # later does not change the database's password — see the guide's
      # "Changing a secret".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gostore -d gostore"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage for product images, served to browsers through the
  # tunnel at IMAGES_DOMAIN.
  #
  # From Quay because MinIO deleted its Docker Hub repositories; these are the
  # last, unpatched community builds. Being replaced by versitygw — see
  # "Decisions still open" in docs/development.md.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: gostore
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the image bucket and makes it publicly readable, then exits. The
  # store has no bucket-creation rights of its own, deliberately. The $$ is
  # Compose's escape for a literal $: the shell reads the password from the
  # environment, so it is not in the command line.
  minio-init:
    image: quay.io/minio/mc:latest
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 gostore "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing local/gostore-images &&
        mc anonymous set download local/gostore-images
    depends_on:
      minio:
        condition: service_healthy

  server:
    image: ghcr.io/17xande-dev/gostore:${GOSTORE_VERSION:?set GOSTORE_VERSION in .env}
    restart: unless-stopped
    env_file: .env
    # Derived here rather than asked for in .env, so the values that have to
    # agree cannot disagree.
    environment:
      DATABASE_URL: postgres://gostore:${POSTGRES_PASSWORD}@postgres:5432/gostore?sslmode=disable
      BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      # The tunnel is the only way in, so CF-Connecting-IP can only have been
      # set by Cloudflare's edge. X-Forwarded-For would be wrong here, not just
      # cautious: Cloudflare appends to it, so its leftmost entry is whatever
      # the client sent.
      CLIENT_IP_SOURCE: cloudflare
      # No default on purpose. The server's own default is the sandbox, which
      # is safe for a first afternoon and silently wrong for a live store: it
      # takes no money and looks fine. A deploy says which it means.
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:?set PAYFAST_SANDBOX in .env to true or false}
      # The server writes to MinIO over the compose network and browsers read
      # from it through the tunnel. It uses MinIO's root credentials — one
      # password fewer to keep, on a MinIO that holds nothing but this store.
      BLOB_ENDPOINT: minio:9000
      BLOB_USE_TLS: "false"
      BLOB_BUCKET: gostore-images
      BLOB_ACCESS_KEY_ID: gostore
      BLOB_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      BLOB_PUBLIC_BASE_URL: https://${IMAGES_DOMAIN:?set IMAGES_DOMAIN in .env}/gostore-images
    volumes:
      # Purchased files, when DOWNLOAD_DIR=/downloads. Mounted either way: an
      # unused volume costs nothing.
      - downloads:/downloads
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Dials out to Cloudflare and carries both hostnames in. Which hostname goes
  # to which service is set on the tunnel in the Cloudflare dashboard, not
  # here. No healthcheck: the image has no shell to run one.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - server

volumes:
  pgdata:
  miniodata:
  downloads:
